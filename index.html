<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <meta name="color-scheme" content="dark" />
  <meta name="description" content="Watch and share videos." />
  <title>Videos</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
 <div id="app" class="app">
   <header id="header" class="main-header">
     <button id="homeBtn" class="icon-button" aria-label="Library"><svg viewBox="0 0 24 24"><path d="m3 9 9-7 9 7v11a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/></svg></button>
     <span class="header-title" id="headerTitle">Videos</span>
     <div class="header-actions"><button id="uploadNav" class="icon-button" title="Upload video" aria-label="Upload video"><svg viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg></button><button id="adminNav" class="icon-button small" title="Upload access" aria-label="Upload access"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21v-2a8 8 0 0 1 16 0v2"/></svg></button></div>
   </header>
   <main id="library" class="page library-page">
      <div id="libraryTop" class="library-top"><h1>Videos</h1><div class="library-tools"><button id="searchButton" class="icon-button" title="Search" aria-label="Search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg></button><input id="searchInput" class="search-input" aria-label="Search videos" placeholder="Search" /></div></div>
      <div id="videoGrid" class="video-grid" aria-live="polite"></div>
      <div id="emptyState" class="empty-state" hidden><button class="empty-upload" id="emptyUpload" aria-label="Upload first video"><svg viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg></button><span>No videos yet</span></div>
   </main>
   <main id="uploadPage" class="page upload-page" hidden>
     <section class="upload-shell" id="uploadShell">
       <div id="dropZone" class="drop-zone" role="button" tabindex="0" aria-label="Choose a video"><svg viewBox="0 0 24 24"><path d="M12 16V3m-5 5 5-5 5 5M4 16v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/></svg><span>Choose a video</span><small>or drop it here</small></div>
       <input id="videoInput" type="file" accept="video/*,.mp4,.mkv,.mov,.webm,.m4v" hidden />
       <div id="uploadDetails" class="upload-details" hidden>
         <div class="selected-file"><img id="previewThumb" alt="Video thumbnail" /><div class="selected-file-info"><strong id="selectedName"></strong><span id="selectedSize"></span></div><button id="removeSelection" class="icon-button" title="Remove file" aria-label="Remove file"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
         <input id="videoTitle" class="title-input" maxlength="140" aria-label="Video title" placeholder="Video title" />
         <div class="subfile-row"><span id="selectedSubLabel">Subtitles</span><label class="text-button" for="uploadSubtitleInput">Add .srt / .vtt</label><input id="uploadSubtitleInput" type="file" accept=".srt,.vtt,text/vtt,application/x-subrip" hidden /></div>
         <div id="uploadProgressPanel" class="progress-panel" hidden><div class="progress-meta"><span id="uploadStatus">Uploading</span><span id="uploadPercent">0%</span></div><div class="progress-rail"><div id="uploadProgress" class="progress-fill"></div></div><div class="progress-bottom"><span id="uploadAmount"></span><button id="cancelUpload" class="text-button" type="button">Cancel</button></div></div>
         <button id="startUpload" class="primary-button" type="button">Upload video</button>
       </div>
       <div id="uploadComplete" class="upload-complete" hidden><div class="complete-head"><svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg><span>Uploaded</span></div><div class="complete-thumbnail"><img id="completeThumb" alt="Video thumbnail" /></div><p id="completeTitle"></p><div class="link-row"><input id="publicUrl" aria-label="Public video URL" readonly /><button id="copyComplete" class="primary-button">Copy link</button></div><div class="complete-actions"><button id="viewComplete" class="text-button">Watch video</button><button id="againComplete" class="text-button">Upload another</button></div></div>
     </section>
   </main>
   <main id="watchPage" class="watch-page" hidden>
     <div id="player" class="player" tabindex="0" aria-label="Video player">
       <video id="video" playsinline preload="metadata" crossorigin="anonymous"></video>
       <div class="player-shade top-shade"></div><div class="player-shade bottom-shade"></div>
       <div id="playerTop" class="player-top control-overlay"><button id="backBtn" class="player-icon" aria-label="Back to videos"><svg viewBox="0 0 24 24"><path d="M19 12H5m7 7-7-7 7-7"/></svg></button><span id="watchTitle"></span><button id="castBtn" class="player-icon" title="Cast" aria-label="Cast"><svg viewBox="0 0 24 24"><path d="M3 19h.01M3 15a4 4 0 0 1 4 4M3 11a8 8 0 0 1 8 8M3 5h17a1 1 0 0 1 1 1v13h-6"/></svg></button></div>
       <button id="centerPlay" class="center-play control-overlay" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path d="m7 4 14 8-14 8z"/></svg></button>
       <div id="playerBottom" class="player-bottom control-overlay">
         <div class="seek-wrap"><input id="seek" class="seek" aria-label="Seek video" type="range" min="0" max="1000" value="0" step="1" /><div id="seekTip" class="seek-tip" hidden>00:00</div></div>
         <div class="controls-line"><div class="controls-left">
          <button id="playBtn" class="player-icon" aria-label="Play"><svg class="play-icon" viewBox="0 0 24 24"><path d="m7 4 14 8-14 8z"/></svg></button>
          <button id="back10" class="player-icon" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5"/><text x="12" y="17" font-size="8" stroke="none" text-anchor="middle" fill="currentColor" font-weight="700">10</text></svg></button>
          <button id="forward10" class="player-icon" aria-label="Forward 10 seconds"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7M21 4v5h-5"/><text x="12" y="17" font-size="8" stroke="none" text-anchor="middle" fill="currentColor" font-weight="700">10</text></svg></button>
          <div class="volume-wrap"><button id="muteBtn" class="player-icon" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Zm4 4a5 5 0 0 1 0 6m3-9a9 9 0 0 1 0 12"/></svg></button><input id="volume" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume" /></div>
          <span id="timeDisplay" class="time-display">0:00 / 0:00</span></div>
          <div class="controls-right">
            <button id="pipBtn" class="player-icon optional-control" title="Picture-in-picture" aria-label="Picture in picture"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="1"/><rect x="12" y="11" width="8" height="6" rx="1"/></svg></button>
            <button id="downloadBtn" class="player-icon optional-control" title="Download" aria-label="Download video"><svg viewBox="0 0 24 24"><path d="M12 3v13m-5-5 5 5 5-5M4 17v4h16v-4"/></svg></button>
            <button id="subtitleBtn" class="player-icon" title="Subtitles" aria-label="Subtitles"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M10 10H7l-1 2 1 2h3m6-4h-3l-1 2 1 2h3"/></svg></button>
            <button id="settingsBtn" class="player-icon" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 1 0 0 8 4 4 0 0 0 0-8Zm8 4 2-1-2-4-2 1-2-2V3H8v3L6 8 4 7l-2 4 2 1-2 1 2 4 2-1 2 2v3h8v-3l2-2 2 1 2-4z"/></svg></button>
            <button id="fullBtn" class="player-icon" title="Fullscreen" aria-label="Fullscreen"><svg viewBox="0 0 24 24"><path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/></svg></button>
          </div></div>
       </div>
       <div id="settingsMenu" class="player-menu settings-menu" hidden><div class="menu-heading">Settings</div><button data-menu="speed"><span>Playback speed</span><span id="speedValue">Normal ›</span></button><button data-menu="subtitles"><span>Subtitles</span><span id="captionValue">Off ›</span></button><button data-menu="quality"><span>Quality</span><span id="qualityValue">Original ›</span></button></div>
       <div id="speedMenu" class="player-menu" hidden><div class="menu-heading"><button class="menu-back" data-menu="settings">‹</button> Playback speed</div><div id="speedChoices"></div></div>
       <div id="qualityMenu" class="player-menu" hidden><div class="menu-heading"><button class="menu-back" data-menu="settings">‹</button> Quality</div><button class="menu-selected">Original <span>✓</span></button></div>
       <div id="subtitlesMenu" class="player-menu" hidden><div class="menu-heading"><button class="menu-back" data-menu="settings">‹</button> Subtitles</div><button id="captionOff" class="menu-selected">Off <span>✓</span></button><button id="captionOn" hidden>Uploaded subtitle <span>✓</span></button><button id="addCaption" class="add-caption">+ Add subtitle file</button><input id="captionFile" type="file" accept=".srt,.vtt" hidden /></div>
       <div id="playerError" class="player-error" hidden><strong>Can't play this video</strong><span id="playerErrorText">This file format may not be supported by your browser.</span></div>
     </div>
   </main>
   <div id="accessOverlay" class="dialog-backdrop" hidden><form id="accessForm" class="access-dialog"><button type="button" id="closeAccess" class="dialog-close" aria-label="Close">×</button><h2>Upload access</h2><p>Enter your upload key</p><input id="accessKeyInput" type="password" autocomplete="off" placeholder="Upload key" required/><label class="remember-row"><input id="rememberAccess" type="checkbox" checked/> Remember on this device</label><button class="primary-button" type="submit">Continue</button></form></div>
   <div id="toast" class="toast" role="status" hidden></div>
 </div>
 <script type="module" src="./app.js"></script>
</body>
</html>
